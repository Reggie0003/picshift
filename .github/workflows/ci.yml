name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: picshift
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: picshift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U picshift -d picshift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: "apps/api/package-lock.json" }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: "apps/web/package-lock.json" }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
      - name: npm audit (api)
        working-directory: apps/api
        run: npm audit --production --audit-level=high || true
      - name: npm audit (web)
        working-directory: apps/web
        run: npm audit --production --audit-level=high || true
