server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Aggressive caching for assets (hashed filenames from Vite)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy API calls to the api service inside the docker network.
  # The web bundle is built with VITE_API_URL=/api so all fetches land here.
  # Trailing slash on the upstream strips the /api/ prefix when forwarding,
  # so /api/v1/auth/login → http://api:4000/v1/auth/login.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;
    # Allow large uploads (documents, payslips) via presigned URLs:
    client_max_body_size 25m;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
