# =============================================================================
# Pic Shift production reverse proxy.
# =============================================================================
# Terminates TLS, forwards /api/* to the API container, and /* to the web
# container. Cloudflare sits in front and provides WAF + DDoS protection.
# =============================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 50m;

  # Realistic client IP from Cloudflare (Cloudflare IP ranges, kept current)
  # https://www.cloudflare.com/ips-v4
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Logging
  log_format json escape=json '{'
    '"ts":"$time_iso8601",'
    '"remote":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ref":"$http_referer","ua":"$http_user_agent","rid":"$http_x_request_id"'
  '}';
  access_log /var/log/nginx/access.log json;

  # Rate limiting buckets
  limit_req_zone $binary_remote_addr zone=req_general:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=req_auth:10m rate=5r/s;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;

  include /etc/nginx/conf.d/*.conf;
}
